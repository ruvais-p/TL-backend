name: tella-backend

services:
  backend:
    image: tella-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-docker-local-only-secret-key-change-before-deploying-7f3a91c2}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-tella_dev}
      POSTGRES_USER: ${POSTGRES_USER:-tella}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tella_dev_local}
      REDIS_URL: redis://redis:6379/0
      MOODLE_ORIGIN: ${MOODLE_ORIGIN:-http://localhost:8080}
      MOODLE_SSO_SECRET: ${MOODLE_SSO_SECRET:-tella-dev-sso-secret-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      COURSE_SUPPORT_CHAT_WEBSOCKET_URL: ${COURSE_SUPPORT_CHAT_WEBSOCKET_URL:-ws://localhost:8000/ws/course-support/}
      COURSE_SUPPORT_CHAT_ALLOWED_ORIGINS: ${COURSE_SUPPORT_CHAT_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      COURSE_SUPPORT_CHAT_ENABLED: ${COURSE_SUPPORT_CHAT_ENABLED:-false}
      AUTH0_ENABLED: ${AUTH0_ENABLED:-false}
      AUTH0_ISSUER: ${AUTH0_ISSUER:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
      MATH_TUTOR_API_URL: ${MATH_TUTOR_API_URL:-https://math-tutor-api-938810058241.europe-west3.run.app}
      MATH_TUTOR_API_KEY: ${MATH_TUTOR_API_KEY:-}
      RUN_MIGRATIONS: "true"
      RUN_SETUP_GROUPS: "true"
    volumes:
      - backend_media:/app/media
      - backend_private_documents:/app/private_documents
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=2)"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tella_dev}
      POSTGRES_USER: ${POSTGRES_USER:-tella}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tella_dev_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  backend_media:
  backend_private_documents:
